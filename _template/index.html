<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>原型标题（请修改）</title>
<link rel="stylesheet" href="../import/prototype-annotate.css" />
<style>
  :root{ --primary:#2f6bff; --border:#e8ebf0; --text:#1f2733; --text-3:#97a0b0; --danger:#f5455c; }
  body{ font-family:"Microsoft YaHei",sans-serif; margin:0; background:#f3f5f8; color:var(--text); font-size:13px; }
  .app{ background:#fff; min-height:100vh; padding:20px; }
  .overlay{ position:fixed; inset:0; background:rgba(15,23,42,.45); display:none; align-items:center; justify-content:center; z-index:100; }
  .overlay.show{ display:flex; }
  .modal{ background:#fff; border-radius:10px; width:440px; max-width:92vw; padding:20px; position:relative; }
  .toast{ position:fixed; top:24px; left:50%; transform:translateX(-50%); background:#1f2733; color:#fff;
    padding:10px 18px; border-radius:8px; z-index:200; opacity:0; transition:.25s; pointer-events:none; }
  .toast.show{ opacity:1; top:34px; }
</style>
</head>
<body>
<div class="app">
  <h2>原型标题</h2>
  <p>复制本模板到新原型目录，修改业务内容与 init 配置。</p>
  <button type="button" id="btnDemo">打开示例弹窗</button>
</div>

<div class="overlay" id="demoOverlay">
  <div class="modal">
    <p>示例弹窗：可在标注模式下在此打点。</p>
    <button type="button" data-close-demo>关闭</button>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
function toast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 1800);
}
document.getElementById('btnDemo').onclick = () => document.getElementById('demoOverlay').classList.add('show');
document.querySelectorAll('[data-close-demo]').forEach(b => b.onclick = () => document.getElementById('demoOverlay').classList.remove('show'));
</script>
<script src="../import/prototype-annotate.js"></script>
<script>
PrototypeAnnotate.init({
  storageKey: 'my-prototype-annotations',
  exportTitle: '原型标题',
  exportFilename: '原型标题-原型标注.md',
  scopeLabels: { page: '页面', demoOverlay: '示例弹窗' },
  builtins: [],
  toast
});
</script>
</body>
</html>
