<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>合规标签 SKU 放开 · 明细</title>
  <style>
    :root {
      --bg:#f0f2f5; --panel:#fff; --line:#e8ebf0; --text:#1f2733; --sub:#5b6577;
      --muted:#97a0b0; --pri:#2f6bff; --pri-bg:#eaf0ff; --ok:#16b364; --ok-bg:#e8f8f0;
      --warn:#fa8c16; --warn-bg:#fff7e6; --danger:#f5455c; --danger-bg:#fff1f0;
      --header-h:48px; --side-w:210px;
    }
    *{box-sizing:border-box}
    body{margin:0;font:13px/1.5 "Microsoft YaHei","PingFang SC",sans-serif;background:var(--bg);color:var(--text)}
    .header{height:var(--header-h);background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;position:sticky;top:0;z-index:30}
    .brand{width:var(--side-w);flex:none;padding:0 16px;font-weight:700;font-size:15px;border-right:1px solid var(--line);height:100%;display:flex;align-items:center}
    .page-tabs{flex:1;display:flex;align-items:flex-end;padding:0 12px;height:100%}
    .ptab{padding:0 14px;height:36px;margin-top:11px;border:1px solid var(--line);border-bottom:none;border-radius:6px 6px 0 0;background:var(--bg);color:var(--pri);font-weight:600;display:flex;align-items:center}
    .user{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--sub);padding:0 16px;border-left:1px solid var(--line)}
    .avatar{width:28px;height:28px;border-radius:50%;background:linear-gradient(135deg,#6ea8ff,#2f6bff);color:#fff;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700}
    .body{display:flex;min-height:calc(100vh - var(--header-h))}
    .sidenav{width:var(--side-w);flex:none;background:#fff;border-right:1px solid var(--line);padding:8px 0}
    .nav-group{padding:8px 14px 4px;font-size:11px;color:var(--muted);font-weight:600}
    .nav-item{padding:9px 14px 9px 18px;color:var(--sub);cursor:pointer}
    .nav-item:hover{color:var(--pri)}
    .nav-item.active{background:var(--pri-bg);color:var(--pri);font-weight:600;border-right:3px solid var(--pri)}
    .content{flex:1;padding:12px;overflow:auto}
    .page{background:var(--panel);min-height:calc(100vh - var(--header-h) - 24px);border-radius:4px}
    .page-hd{padding:16px 20px 12px;display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;border-bottom:1px solid var(--line)}
    .page-title{font-size:16px;font-weight:700;margin:0}
    .filters{border-bottom:1px solid var(--line)}
    .filters-hd{padding:10px 20px 0;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
    .filters-hd .title{font-weight:600;font-size:13px}
    .filters-hd .spacer{flex:1}
    .filters-body{padding:10px 20px 12px}
    .filter-row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
    .filter-row.more{display:none;margin-top:10px;padding-top:10px;border-top:1px dashed var(--line)}
    .filters.expanded .filter-row.more{display:flex}
    .field{display:flex;align-items:stretch;height:32px}
    .field .lbl{background:#f6f8fb;border:1px solid var(--line);border-right:none;border-radius:4px 0 0 4px;padding:0 10px;display:flex;align-items:center;color:var(--sub);white-space:nowrap;font-size:12px}
    .ctrl{height:32px;border:1px solid var(--line);border-radius:4px;background:#fff;padding:0 10px;color:var(--text);font-size:12px;outline:none;min-width:110px}
    .field .ctrl{border-radius:0 4px 4px 0}
    .field .ctrl:focus{border-color:var(--pri)}
    .field.bulk-field{height:auto;align-items:stretch}
    .field.bulk-field .lbl{height:32px}
    .sku-query-wrap{display:flex;align-items:stretch;flex:1;min-width:140px;height:32px;border:1px solid var(--line);border-radius:0 4px 4px 0;background:#fff}
    .sku-query-input-cell{position:relative;flex:1;display:flex;align-items:center;min-width:120px}
    .sku-query-input{border:none;box-shadow:none;flex:1;height:30px;padding:0 10px;font-size:12px;outline:none;background:transparent;min-width:0}
    .sku-query-more{flex:none;width:30px;height:30px;border:none;border-left:1px solid var(--line);background:#fff;color:var(--sub);cursor:pointer;font-size:16px;line-height:1;letter-spacing:-2px}
    .sku-query-more:hover{color:var(--pri);background:#f6f8fb}
    .sku-query-popover{display:none;position:absolute;top:calc(100% + 4px);right:0;z-index:50;width:min(340px,88vw);background:#fff;border:1px solid var(--line);border-radius:6px;box-shadow:0 8px 24px rgba(0,0,0,.12);padding:12px}
    .sku-query-popover.show{display:block}
    .sku-query-popover textarea{width:100%;min-height:128px;border:1px solid var(--line);border-radius:4px;padding:8px 10px;font:12px/1.55 inherit;resize:vertical;outline:none;box-sizing:border-box}
    .sku-query-popfoot{display:flex;justify-content:flex-end;gap:8px;margin-top:10px}
    .field.multi-field{position:relative;height:auto;align-items:stretch}
    .field.multi-field .lbl{height:32px}
    .multi-wrap{position:relative}
    .multi-trigger{height:32px;min-width:120px;max-width:180px;border:1px solid var(--line);border-radius:0 4px 4px 0;background:#fff;padding:0 28px 0 10px;color:var(--text);font-size:12px;text-align:left;cursor:pointer;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;background:#fff url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='10' height='10' viewBox='0 0 10 10'><path d='M1 3l4 4 4-4' stroke='%2397a0b0' fill='none' stroke-width='1.4'/></svg>") no-repeat right 9px center}
    .multi-trigger.on{border-color:var(--pri);color:var(--pri)}
    .multi-panel{display:none;position:absolute;top:calc(100% + 4px);left:0;z-index:40;min-width:220px;max-width:320px;max-height:240px;overflow:auto;background:#fff;border:1px solid var(--line);border-radius:6px;box-shadow:0 8px 24px rgba(31,39,51,.12);padding:6px 0}
    .multi-panel.show{display:block}
    .multi-item{display:flex;align-items:center;gap:8px;padding:6px 12px;font-size:12px;cursor:pointer;white-space:nowrap}
    .multi-item:hover{background:#f6f8fb}
    .multi-item input{margin:0;cursor:pointer}
    .multi-actions{display:flex;gap:8px;padding:6px 12px 4px;border-bottom:1px dashed var(--line);margin-bottom:4px}
    .multi-actions button{border:none;background:none;color:var(--pri);font-size:11px;cursor:pointer;padding:0}
    select.ctrl{appearance:none;cursor:pointer;padding-right:26px;background:#fff url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='10' height='10' viewBox='0 0 10 10'><path d='M1 3l4 4 4-4' stroke='%2397a0b0' fill='none' stroke-width='1.4'/></svg>") no-repeat right 9px center}
    .btn{height:32px;border:1px solid var(--line);background:#fff;border-radius:4px;padding:0 14px;cursor:pointer;font-size:12px}
    .btn:hover{border-color:var(--pri);color:var(--pri)}
    .btn.pri{background:var(--pri);border-color:var(--pri);color:#fff}
    .btn.pri:hover{background:#1a52d4;color:#fff}
    .btn.ghost{background:transparent}
    .filter-badge{display:inline-flex;align-items:center;justify-content:center;min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:var(--pri);color:#fff;font-size:11px;font-weight:700;margin-left:4px}
    .hint{font-size:11px;color:var(--muted)}
    .tabs{display:flex;gap:2px;padding:0 20px;border-bottom:1px solid var(--line);flex-wrap:wrap}
    .tab{padding:10px 14px;cursor:pointer;color:var(--sub);font-size:13px;border-bottom:2px solid transparent;margin-bottom:-1px}
    .tab:hover{color:var(--pri)}
    .tab.on{color:var(--pri);font-weight:600;border-bottom-color:var(--pri)}
    .tab .cnt{display:inline-block;margin-left:4px;padding:0 6px;border-radius:9px;background:#f0f2f5;font-size:11px;color:var(--sub);font-weight:600}
    .tab.on .cnt{background:var(--pri-bg);color:var(--pri)}
    .table-toolbar{padding:10px 20px;display:flex;align-items:center;gap:10px;flex-wrap:wrap;font-size:12px;color:var(--sub)}
    .table-toolbar .spacer{flex:1}
    .table-wrap{padding:0 20px 12px;overflow-x:auto}
    table.data{width:100%;border-collapse:collapse;min-width:1180px;font-size:12px}
    table.data thead th{background:#f6f8fb;color:var(--sub);font-weight:600;text-align:left;padding:10px;border-bottom:1px solid var(--line);white-space:nowrap}
    table.data tbody td{padding:9px 10px;border-bottom:1px solid var(--line);vertical-align:middle}
    table.data tbody tr:hover{background:#fafbfd}
    .link{color:var(--pri);cursor:pointer;font-weight:600}
    .link:hover{text-decoration:underline}
    .mono{font-family:Consolas,"Courier New",monospace;font-size:11px}
    .tag{display:inline-flex;align-items:center;padding:1px 8px;border-radius:3px;font-size:11px;font-weight:600;white-space:nowrap}
    .tag.ok{background:var(--ok-bg);color:var(--ok)}
    .tag.warn{background:var(--warn-bg);color:var(--warn)}
    .tag.danger{background:var(--danger-bg);color:var(--danger)}
    .tag.muted{background:#f0f2f5;color:var(--sub)}
    .tag.pri{background:var(--pri-bg);color:var(--pri)}
    .pager{display:flex;align-items:center;justify-content:flex-end;gap:8px;padding:0 20px 20px;font-size:12px;color:var(--sub)}
    .pager button{height:28px;min-width:28px;border:1px solid var(--line);background:#fff;border-radius:4px;cursor:pointer;font-size:12px;padding:0 8px}
    .pager button:disabled{opacity:.4;cursor:not-allowed}
    .pager button.on{background:var(--pri);border-color:var(--pri);color:#fff}
    .overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:100;align-items:center;justify-content:center;padding:20px}
    .overlay.show{display:flex}
    .modal{width:680px;max-width:96vw;max-height:88vh;background:#fff;border-radius:8px;box-shadow:0 12px 40px rgba(0,0,0,.18);display:flex;flex-direction:column;overflow:hidden}
    .modal-hd{padding:14px 18px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px;font-size:14px;font-weight:600}
    .modal-hd .x{margin-left:auto;cursor:pointer;color:var(--muted);font-size:20px;line-height:1;border:none;background:none}
    .modal-bd{padding:16px 18px;overflow:auto;flex:1}
    .dl{display:grid;grid-template-columns:120px 1fr;gap:8px 12px;font-size:12px}
    .dl .k{color:var(--sub)}
    .dl .v{word-break:break-all}
    .modal-ft{padding:12px 18px;border-top:1px solid var(--line);display:flex;justify-content:flex-end;gap:8px}
    .toast{position:fixed;top:24px;left:50%;transform:translateX(-50%);background:#1f2733;color:#fff;padding:10px 18px;border-radius:8px;z-index:200;opacity:0;transition:.25s;pointer-events:none}
    .toast.show{opacity:1;top:34px}
  </style>
</head>
<body>
  <div class="header">
    <div class="brand">风控系统</div>
    <div class="page-tabs"><div class="ptab">合规标签 SKU 放开监控</div></div>
    <div class="user">
      <span>合规性看板</span>
      <div class="avatar">产</div>
      <span>产品同学</span>
    </div>
  </div>

  <div class="body">
    <aside class="sidenav">
      <div class="nav-group">合规性项目</div>
      <div class="nav-item" id="navOverview">放开效果决策</div>
      <div class="nav-item active">明细列表</div>
    </aside>

    <main class="content">
      <div class="page">
        <div class="page-hd">
          <div>
            <h1 class="page-title">明细列表</h1>
          </div>
          <div>
            <button type="button" class="btn" id="btnBack">← 返回决策台</button>
          </div>
        </div>

        <div class="filters" id="filterPanel">
          <div class="filters-hd">
            <span class="title">筛选条件</span>
            <span class="hint" id="activeFilterHint"></span>
            <span class="spacer"></span>
            <button type="button" class="btn ghost" id="btnToggleMore">展开更多筛选</button>
          </div>
          <div class="filters-body">
            <div class="filter-row">
              <div class="field">
                <span class="lbl">平台</span>
                <select class="ctrl" id="fPlatform" style="min-width:120px">
                  <option value="亚马逊">亚马逊</option>
                  <option value="沃尔玛">沃尔玛（待接入）</option>
                  <option value="速卖通">速卖通（待接入）</option>
                </select>
              </div>
              <div class="field"><span class="lbl">站点</span><select class="ctrl" id="fSite"><option value="">全部</option></select></div>
              <div class="field"><span class="lbl">刊登部门</span><select class="ctrl" id="fDept"><option value="">全部</option></select></div>
              <div class="field bulk-field">
                <span class="lbl">SKU</span>
                <div class="sku-query-wrap" id="skuQuery" data-max="500" data-unit="SKU">
                  <div class="sku-query-input-cell">
                    <input type="text" class="sku-query-input" placeholder="请输入SKU" />
                    <button type="button" class="sku-query-more" title="批量粘贴" aria-label="批量输入SKU">⋮</button>
                    <div class="sku-query-popover">
                      <textarea placeholder="一行一项，支持粘贴；回车换行"></textarea>
                      <div class="sku-query-popfoot">
                        <button type="button" class="btn" data-sku-act="clear">清空</button>
                        <button type="button" class="btn pri" data-sku-act="ok">确定</button>
                      </div>
                    </div>
                  </div>
                </div>
              </div>
              <div class="field bulk-field">
                <span class="lbl">MSKU</span>
                <div class="sku-query-wrap" id="mskuQuery" data-max="500" data-unit="MSKU">
                  <div class="sku-query-input-cell">
                    <input type="text" class="sku-query-input" placeholder="请输入MSKU" />
                    <button type="button" class="sku-query-more" title="批量粘贴" aria-label="批量输入MSKU">⋮</button>
                    <div class="sku-query-popover">
                      <textarea placeholder="一行一项，支持粘贴；回车换行"></textarea>
                      <div class="sku-query-popfoot">
                        <button type="button" class="btn" data-sku-act="clear">清空</button>
                        <button type="button" class="btn pri" data-sku-act="ok">确定</button>
                      </div>
                    </div>
                  </div>
                </div>
              </div>
              <div class="field multi-field" id="wrapShop">
                <span class="lbl">店铺名称</span>
                <div class="multi-wrap">
                  <button type="button" class="multi-trigger" id="triggerShop" style="min-width:140px;max-width:200px">全部</button>
                  <div class="multi-panel" id="panelShop"></div>
                </div>
              </div>
              <button type="button" class="btn pri" id="btnQuery">查询</button>
              <button type="button" class="btn" id="btnReset">重置</button>
            </div>
            <div class="filter-row more" id="filterMore">
              <div class="field"><span class="lbl">三级类目</span><select class="ctrl" id="fCat3" style="min-width:160px"><option value="">全部</option></select></div>
              <div class="field"><span class="lbl">邮件处理状态</span><select class="ctrl" id="fMailStatus" style="min-width:120px"><option value="">全部</option><option value="__none__">无</option></select></div>
              <div class="field"><span class="lbl">销售申诉结果</span><select class="ctrl" id="fAppeal" style="min-width:120px"><option value="">全部</option><option value="__none__">无</option></select></div>
              <div class="field"><span class="lbl">是否做CPC认证</span><select class="ctrl" id="fCpc"><option value="">全部</option><option value="是">是</option><option value="否">否</option></select></div>
              <div class="field"><span class="lbl">刊登后是否出单</span><select class="ctrl" id="fHasOrder"><option value="">全部</option><option value="是">是</option><option value="否">否</option></select></div>
              <div class="field"><span class="lbl">是否有合规性标签</span><select class="ctrl" id="fLabel"><option value="">全部</option><option value="是">是</option><option value="否">否</option></select></div>
              <div class="field"><span class="lbl">刊登时间</span>
                <div style="display:flex;align-items:center;gap:6px">
                  <input class="ctrl" type="date" id="fListFrom" style="min-width:132px" />
                  <span style="color:var(--sub)">至</span>
                  <input class="ctrl" type="date" id="fListTo" style="min-width:132px" />
                </div>
              </div>
            </div>
          </div>
        </div>

        <div class="table-toolbar" style="margin-top:4px">
          <span id="listHint">明细列表</span>
          <div class="spacer"></div>
          <button type="button" class="btn" id="btnExport">导出当前明细</button>
        </div>
        <div class="table-wrap">
          <table class="data">
            <thead>
              <tr>
                <th>站点</th>
                <th>MSKU</th>
                <th>SKU</th>
                <th>ASIN</th>
                <th>店铺</th>
                <th>刊登时间</th>
                <th>开发时间</th>
                <th>合规标签</th>
                <th>CPC</th>
                <th>收到合规性邮件时间</th>
                <th>邮件状态</th>
                <th>出单/金额</th>
                <th>备注</th>
                <th>操作</th>
              </tr>
            </thead>
            <tbody id="listBody"></tbody>
          </table>
        </div>
        <div class="pager" id="pager"></div>
      </div>
    </main>
  </div>

  <div class="overlay" id="detailOverlay">
    <div class="modal">
      <div class="modal-hd">SKU 详情<button type="button" class="x" data-close>×</button></div>
      <div class="modal-bd" id="detailBody"></div>
      <div class="modal-ft"><button type="button" class="btn" data-close>关闭</button></div>
    </div>
  </div>
  <div class="toast" id="toast"></div>

  <script src="./dashboard_payload_v1_2.js"></script>
  <script>
  const DATA = window.DASHBOARD_DATA;
  if (!DATA) {
    document.body.innerHTML = '<div style="padding:40px;font-family:Microsoft YaHei">未加载到 dashboard_payload_v1_2.js，请与 HTML 放在同一目录。</div>';
    throw new Error('missing DASHBOARD_DATA');
  }

  const SITE_STATS_3D = DATA.site_stats_3d || [];
  const SITE_ORDER = SITE_STATS_3D.map(s => s.site);
  const POOL = DATA.samples.pool || [];
  const DEPT_3D = DATA.dept_stats_3d || {};
  const APPEAL_STATS = DATA.appeal || {};

  const OVERVIEW_PAGE = /明细/.test(decodeURIComponent(location.pathname))
    ? '合规SKU数据看板-总览页.html' : './index.html';

  const PLATFORMS_READY = ['亚马逊'];
  const qs = new URLSearchParams(location.search);
  function parseMultiParam(key) {
    const v = qs.get(key);
    if (!v) return [];
    return v.split(',').map(s => s.trim()).filter(Boolean);
  }

  const state = {
    platform: qs.get('platform') || '亚马逊',
    site: qs.get('site') || '',
    dept: qs.get('dept') || '',
    sku: parseMultiParam('sku'),
    msku: parseMultiParam('msku'),
    shop: parseMultiParam('shop'),
    cat3: qs.get('cat3') || '',
    mailStatus: qs.get('mailStatus') || '',
    appeal: qs.get('appeal') || '',
    cpc: qs.get('cpc') || '',
    hasOrder: qs.get('hasOrder') || '',
    label: qs.get('label') || '',
    listFrom: qs.get('listFrom') || '',
    listTo: qs.get('listTo') || '',
    page: 1,
    pageSize: 10,
    filtersExpanded: false,
  };

  function platformReady() { return PLATFORMS_READY.includes(state.platform); }
  function toast(msg) {
    const t = document.getElementById('toast');
    t.textContent = msg;
    t.classList.add('show');
    clearTimeout(toast._t);
    toast._t = setTimeout(() => t.classList.remove('show'), 1800);
  }
  function fmt(n) {
    if (n == null || n === '') return '—';
    return Number(n).toLocaleString('zh-CN', { maximumFractionDigits: 2 });
  }
  function money(n) { return '$' + fmt(n || 0); }
  function isBlankVal(v) {
    return v == null || v === '' || v === '1' || v === '无' || v === 'None';
  }
  function fmtMailTime(v) {
    if (isBlankVal(v)) return '';
    return String(v);
  }

  const MULTI_CFG = {
    shop: { panel: 'panelShop', trigger: 'triggerShop', field: 'shop' },
  };

  function parseBulkLines(text, max) {
    const lines = (text || '').split(/\r?\n/).map(s => s.trim()).filter(Boolean);
    const unique = [...new Set(lines)];
    if (unique.length > max) return { items: unique.slice(0, max), truncated: true };
    return { items: unique, truncated: false };
  }
  function closeAllBulkPopovers() {
    document.querySelectorAll('.sku-query-popover.show').forEach(p => p.classList.remove('show'));
  }
  function setBulkQuery(wrap, items) {
    if (!wrap) return;
    const max = parseInt(wrap.dataset.max || '500', 10);
    const list = (items || []).slice(0, max);
    const ta = wrap.querySelector('.sku-query-popover textarea');
    const input = wrap.querySelector('.sku-query-input');
    const unit = wrap.dataset.unit || '项';
    if (ta) ta.value = list.join('\n');
    if (input) {
      if (!list.length) {
        input.value = '';
        delete input.dataset.skuBulk;
      } else {
        input.value = list.length === 1 ? list[0] : `${list.length}个${unit}`;
        input.dataset.skuBulk = list.join('\n');
      }
    }
  }
  function applyBulkQuery(wrap) {
    if (!wrap) return [];
    const max = parseInt(wrap.dataset.max || '500', 10);
    const ta = wrap.querySelector('.sku-query-popover textarea');
    const input = wrap.querySelector('.sku-query-input');
    const unit = wrap.dataset.unit || '项';
    const { items, truncated } = parseBulkLines(ta?.value || '', max);
    if (!items.length) {
      toast(`请输入至少一个 ${unit}`);
      return [];
    }
    if (input) {
      input.value = items.length === 1 ? items[0] : `${items.length}个${unit}`;
      input.dataset.skuBulk = items.join('\n');
    }
    closeAllBulkPopovers();
    if (truncated) toast(`最多 ${max} 个，已截取前 ${max} 个`);
    else toast(`已填入 ${items.length} 个 ${unit}`);
    return items;
  }
  function resetBulkQuery(wrap) {
    if (!wrap) return;
    const ta = wrap.querySelector('.sku-query-popover textarea');
    const input = wrap.querySelector('.sku-query-input');
    if (ta) ta.value = '';
    if (input) {
      input.value = '';
      delete input.dataset.skuBulk;
    }
  }
  function getBulkFilter(wrapId) {
    const wrap = document.getElementById(wrapId);
    const input = wrap?.querySelector('.sku-query-input');
    if (!input) return [];
    if (input.dataset.skuBulk) {
      return input.dataset.skuBulk.split('\n').map(s => s.trim()).filter(Boolean);
    }
    const v = input.value.trim();
    if (!v || /^\d+个/.test(v)) return [];
    return [v];
  }
  function initBulkQueryFields() {
    document.querySelectorAll('.sku-query-wrap').forEach(wrap => {
      const more = wrap.querySelector('.sku-query-more');
      const pop = wrap.querySelector('.sku-query-popover');
      const input = wrap.querySelector('.sku-query-input');
      more?.addEventListener('click', e => {
        e.stopPropagation();
        const wasOpen = pop?.classList.contains('show');
        closeAllBulkPopovers();
        closeAllMultiPanels();
        if (!wasOpen) {
          pop?.classList.add('show');
          wrap.querySelector('.sku-query-popover textarea')?.focus();
        }
      });
      wrap.querySelector('[data-sku-act="clear"]')?.addEventListener('click', e => {
        e.stopPropagation();
        resetBulkQuery(wrap);
      });
      wrap.querySelector('[data-sku-act="ok"]')?.addEventListener('click', e => {
        e.stopPropagation();
        applyBulkQuery(wrap);
      });
      input?.addEventListener('input', () => {
        if (!input.value.trim()) delete input.dataset.skuBulk;
      });
      pop?.addEventListener('click', e => e.stopPropagation());
    });
  }

  function initMultiSelects() {
    const shopSet = new Set();
    POOL.forEach(r => {
      if (r.shop) shopSet.add(String(r.shop));
    });
    buildMultiPanel('shop', [...shopSet].sort());
    updateMultiTrigger('shop');
  }

  function buildMultiPanel(key, options) {
    const cfg = MULTI_CFG[key];
    const panel = document.getElementById(cfg.panel);
    panel.innerHTML = `
      <div class="multi-actions">
        <button type="button" data-multi="${key}" data-act="all">全选</button>
        <button type="button" data-multi="${key}" data-act="clear">清空</button>
      </div>
      ${options.map(v => `
        <label class="multi-item">
          <input type="checkbox" data-multi="${key}" value="${escapeAttr(v)}" />
          <span title="${escapeAttr(v)}">${v.length > 26 ? v.slice(0, 26) + '…' : v}</span>
        </label>`).join('')}`;
  }
  function escapeAttr(s) {
    return String(s).replace(/&/g, '&amp;').replace(/"/g, '&quot;').replace(/</g, '&lt;');
  }

  function getMultiValues(key) {
    const cfg = MULTI_CFG[key];
    return [...document.querySelectorAll(`#${cfg.panel} input[type=checkbox]:checked`)].map(el => el.value);
  }
  function setMultiValues(key, values) {
    const cfg = MULTI_CFG[key];
    const set = new Set(values || []);
    document.querySelectorAll(`#${cfg.panel} input[type=checkbox]`).forEach(el => {
      el.checked = set.has(el.value);
    });
    updateMultiTrigger(key);
  }
  function updateMultiTrigger(key) {
    const cfg = MULTI_CFG[key];
    const vals = getMultiValues(key);
    state[key] = vals;
    const btn = document.getElementById(cfg.trigger);
    if (!vals.length) {
      btn.textContent = '全部';
      btn.classList.remove('on');
    } else if (vals.length === 1) {
      btn.textContent = vals[0].length > 16 ? vals[0].slice(0, 16) + '…' : vals[0];
      btn.classList.add('on');
    } else {
      btn.textContent = `已选 ${vals.length} 项`;
      btn.classList.add('on');
    }
  }
  function closeAllMultiPanels() {
    Object.keys(MULTI_CFG).forEach(k => {
      document.getElementById(MULTI_CFG[k].panel).classList.remove('show');
    });
  }

  function initFilterOptions() {
    const cat3Set = new Set();
    const mailSet = new Set();
    const appealSet = new Set(Object.keys(APPEAL_STATS));
    POOL.forEach(r => {
      if (r.cat3) cat3Set.add(r.cat3);
      if (r.mail_status) mailSet.add(r.mail_status);
      if (r.appeal) appealSet.add(r.appeal);
    });

    SITE_ORDER.forEach(s => {
      const o = document.createElement('option');
      o.value = s; o.textContent = s;
      document.getElementById('fSite').appendChild(o);
    });
    Object.keys(DEPT_3D).sort((a, b) => (DEPT_3D[b].rows - DEPT_3D[a].rows)).forEach(k => {
      const o = document.createElement('option');
      o.value = k; o.textContent = k;
      document.getElementById('fDept').appendChild(o);
    });
    [...cat3Set].sort().forEach(c => {
      const o = document.createElement('option');
      o.value = c;
      o.textContent = c.length > 28 ? c.slice(0, 28) + '…' : c;
      o.title = c;
      document.getElementById('fCat3').appendChild(o);
    });
    [...mailSet].sort().forEach(m => {
      const o = document.createElement('option');
      o.value = m; o.textContent = m;
      document.getElementById('fMailStatus').appendChild(o);
    });
    [...appealSet].sort().forEach(a => {
      const o = document.createElement('option');
      o.value = a; o.textContent = a;
      document.getElementById('fAppeal').appendChild(o);
    });
  }

  function matchRow(r) {
    if (!platformReady()) return false;
    const rowPlat = r.platform || '亚马逊';
    if (state.platform && rowPlat !== state.platform) return false;
    if (state.site && r.site !== state.site) return false;
    if (state.dept && r.dept !== state.dept) return false;
    if (state.sku.length && !state.sku.includes(String(r.sku ?? ''))) return false;
    if (state.msku.length && !state.msku.includes(String(r.msku ?? ''))) return false;
    if (state.shop.length && !state.shop.includes(String(r.shop ?? ''))) return false;
    if (state.cat3 && String(r.cat3 || '') !== state.cat3) return false;
    if (state.label && r.label !== state.label) return false;
    if (state.cpc && r.cpc !== state.cpc) return false;
    if (state.mailStatus === '__none__' && r.mail_status) return false;
    if (state.mailStatus === '__has__' && !r.mail_time && !r.mail_status) return false;
    if (state.mailStatus && state.mailStatus !== '__none__' && state.mailStatus !== '__has__' && r.mail_status !== state.mailStatus) return false;
    if (state.appeal === '__none__' && r.appeal) return false;
    if (state.appeal && state.appeal !== '__none__' && r.appeal !== state.appeal) return false;
    if (state.hasOrder === '是' && !(r.orders > 0)) return false;
    if (state.hasOrder === '否' && (r.orders > 0)) return false;
    if (state.listFrom || state.listTo) {
      const day = String(r.list_time || '').replace(/\//g, '-').slice(0, 10);
      if (day.length >= 10) {
        if (state.listFrom && day < state.listFrom) return false;
        if (state.listTo && day > state.listTo) return false;
      } else if (!(state.sku.length || state.msku.length)) {
        // 无刊登时间：仅在按 SKU/MSKU 精确定位时保留
        return false;
      }
    }
    return true;
  }

  function filteredRows() { return POOL.filter(matchRow); }

  function primaryFilterKeys() {
    return ['site', 'dept', 'sku', 'msku', 'shop'];
  }
  function moreFilterKeys() {
    return ['cat3', 'mailStatus', 'appeal', 'cpc', 'hasOrder', 'label', 'listFrom', 'listTo'];
  }
  function filterHasValue(k) {
    const v = state[k];
    if (Array.isArray(v)) return v.length > 0;
    return !!v;
  }
  function activeFilterCount() {
    let n = primaryFilterKeys().filter(filterHasValue).length;
    n += moreFilterKeys().filter(filterHasValue).length;
    if (state.platform && state.platform !== '亚马逊') n += 1;
    return n;
  }
  function hasAnyFilter() {
    return activeFilterCount() > 0;
  }

  function updateFilterUI() {
    const moreCount = moreFilterKeys().filter(k => state[k]).length;
    document.getElementById('btnToggleMore').innerHTML =
      (state.filtersExpanded ? '收起更多筛选' : '展开更多筛选') +
      (moreCount > 0 ? ` <span class="filter-badge">${moreCount}</span>` : '');
    document.getElementById('filterPanel').classList.toggle('expanded', state.filtersExpanded);
    document.getElementById('activeFilterHint').textContent =
      hasAnyFilter() ? `已启用 ${activeFilterCount()} 项筛选` : '';
  }

  function renderList() {
    updateFilterUI();
    const rows = filteredRows();
    document.getElementById('listHint').textContent = platformReady()
      ? `当前 ${rows.length} 条（演示池 ${POOL.length}）`
      : `${state.platform} 暂未接入数据`;

    const pages = Math.max(1, Math.ceil(rows.length / state.pageSize));
    if (state.page > pages) state.page = pages;
    const pageRows = rows.slice((state.page - 1) * state.pageSize, state.page * state.pageSize);
    document.getElementById('listBody').innerHTML = pageRows.map(r => `
      <tr>
        <td><b>${r.site || '-'}</b></td>
        <td class="mono"><span class="link" data-key="${encodeURIComponent(r.msku + '|' + r.site)}">${r.msku || '-'}</span></td>
        <td class="mono">${r.sku || '-'}</td>
        <td class="mono">${r.asin || '-'}</td>
        <td>${r.shop || '-'}</td>
        <td>${r.list_time || '-'}</td>
        <td>${r.dev_time || '-'}</td>
        <td>${r.label === '是' ? '<span class="tag ok">是</span>' : r.label === '否' ? '<span class="tag danger">否</span>' : '<span class="tag muted">-</span>'}</td>
        <td>${r.cpc === '是' ? '<span class="tag pri">是</span>' : '<span class="tag muted">否</span>'}</td>
        <td>${fmtMailTime(r.mail_time)}</td>
        <td>${r.mail_status ? `<span class="tag ${r.mail_status === '未处理' ? 'warn' : 'ok'}">${r.mail_status}</span>` : ''}</td>
        <td>${r.orders ? `${fmt(r.orders)} / ${money(r.amount)}` : ''}</td>
        <td title="${r.remark || ''}">${(r.remark || '-').length > 10 ? (r.remark || '').slice(0, 10) + '…' : (r.remark || '-')}</td>
        <td><span class="link" data-key="${encodeURIComponent(r.msku + '|' + r.site)}">详情</span></td>
      </tr>
    `).join('') || `<tr><td colspan="14" style="text-align:center;color:var(--muted);padding:28px">无匹配明细，可放宽筛选</td></tr>`;

    let ph = `<span>共 ${rows.length} 条</span>`;
    ph += `<button type="button" data-p="${state.page - 1}" ${state.page <= 1 ? 'disabled' : ''}>上一页</button>`;
    for (let i = 1; i <= pages && i <= 6; i++) ph += `<button type="button" class="${i === state.page ? 'on' : ''}" data-p="${i}">${i}</button>`;
    ph += `<button type="button" data-p="${state.page + 1}" ${state.page >= pages ? 'disabled' : ''}>下一页</button>`;
    document.getElementById('pager').innerHTML = ph;
  }

  function openDetail(key) {
    const [msku, site] = decodeURIComponent(key).split('|');
    const r = POOL.find(x => String(x.msku) === msku && String(x.site) === site) || POOL.find(x => String(x.msku) === msku);
    if (!r) return;
    document.getElementById('detailBody').innerHTML = `
      <div class="dl">
        <div class="k">平台</div><div class="v">${r.platform || '亚马逊'}</div>
        <div class="k">刊登部门</div><div class="v">${r.dept || '-'}</div>
        <div class="k">备注</div><div class="v">${r.remark || '-'}</div>
        <div class="k">站点</div><div class="v"><b>${r.site || '-'}</b></div>
        <div class="k">MSKU</div><div class="v">${r.msku || '-'}</div>
        <div class="k">SKU</div><div class="v">${r.sku || '-'}</div>
        <div class="k">ASIN</div><div class="v">${r.asin || '-'}</div>
        <div class="k">店铺</div><div class="v">${r.shop || '-'}</div>
        <div class="k">刊登时间</div><div class="v">${r.list_time || '-'}</div>
        <div class="k">开发时间</div><div class="v">${r.dev_time || '-'}</div>
        <div class="k">中文标题</div><div class="v">${r.title || '-'}</div>
        <div class="k">类目</div><div class="v">${r.cat || '-'}</div>
        <div class="k">三级类目</div><div class="v">${r.cat3 || '-'}</div>
        <div class="k">合规标签</div><div class="v">${r.label || '-'} ${r.label_time ? ('· ' + r.label_time) : ''}</div>
        <div class="k">CPC认证</div><div class="v">${r.cpc || '-'}</div>
        <div class="k">收到合规性邮件时间</div><div class="v">${fmtMailTime(r.mail_time) || '-'}</div>
        <div class="k">邮件处理状态</div><div class="v">${r.mail_status || '-'}</div>
        <div class="k">移除原因</div><div class="v">${r.remove_reason || '-'}</div>
        <div class="k">销售申诉</div><div class="v">${r.appeal || '-'}</div>
        <div class="k">出单/金额</div><div class="v">${r.orders ? `${fmt(r.orders)} / ${money(r.amount)}` : '-'}</div>
      </div>`;
    document.getElementById('detailOverlay').classList.add('show');
  }

  function readFilters() {
    state.platform = document.getElementById('fPlatform').value || '亚马逊';
    state.site = document.getElementById('fSite').value;
    state.dept = document.getElementById('fDept').value;
    state.sku = getBulkFilter('skuQuery');
    state.msku = getBulkFilter('mskuQuery');
    state.shop = getMultiValues('shop');
    state.cat3 = document.getElementById('fCat3').value;
    state.mailStatus = document.getElementById('fMailStatus').value;
    state.appeal = document.getElementById('fAppeal').value;
    state.cpc = document.getElementById('fCpc').value;
    state.hasOrder = document.getElementById('fHasOrder').value;
    state.label = document.getElementById('fLabel').value;
    state.listFrom = document.getElementById('fListFrom').value;
    state.listTo = document.getElementById('fListTo').value;
  }
  function syncFiltersToUI() {
    document.getElementById('fPlatform').value = state.platform;
    document.getElementById('fSite').value = state.site;
    document.getElementById('fDept').value = state.dept;
    setBulkQuery(document.getElementById('skuQuery'), state.sku);
    setBulkQuery(document.getElementById('mskuQuery'), state.msku);
    setMultiValues('shop', state.shop);
    document.getElementById('fCat3').value = state.cat3;
    document.getElementById('fMailStatus').value = state.mailStatus;
    document.getElementById('fAppeal').value = state.appeal;
    document.getElementById('fCpc').value = state.cpc;
    document.getElementById('fHasOrder').value = state.hasOrder;
    document.getElementById('fLabel').value = state.label;
    document.getElementById('fListFrom').value = state.listFrom;
    document.getElementById('fListTo').value = state.listTo;
  }

  document.getElementById('navOverview').onclick = () => { location.href = OVERVIEW_PAGE; };
  document.getElementById('btnBack').onclick = () => { location.href = OVERVIEW_PAGE; };
  document.getElementById('btnToggleMore').onclick = () => {
    state.filtersExpanded = !state.filtersExpanded;
    updateFilterUI();
  };
  document.getElementById('btnQuery').onclick = () => {
    readFilters();
    state.page = 1;
    renderList();
    toast('已查询');
  };
  document.getElementById('fPlatform').onchange = () => {
    readFilters();
    state.site = '';
    document.getElementById('fSite').value = '';
    state.page = 1;
    renderList();
  };
  document.getElementById('btnReset').onclick = () => {
    state.platform = '亚马逊';
    state.site = '';
    state.dept = '';
    state.sku = [];
    state.msku = [];
    state.shop = [];
    state.cat3 = '';
    state.mailStatus = '';
    state.appeal = '';
    state.cpc = '';
    state.hasOrder = '';
    state.label = '';
    state.listFrom = '';
    state.listTo = '';
    state.page = 1;
    resetBulkQuery(document.getElementById('skuQuery'));
    resetBulkQuery(document.getElementById('mskuQuery'));
    syncFiltersToUI();
    renderList();
    toast('已重置');
  };
  document.getElementById('listBody').addEventListener('click', e => {
    const a = e.target.closest('[data-key]');
    if (a) openDetail(a.dataset.key);
  });
  document.getElementById('pager').addEventListener('click', e => {
    const b = e.target.closest('[data-p]');
    if (!b || b.disabled) return;
    state.page = Number(b.dataset.p);
    renderList();
  });
  document.getElementById('btnExport').onclick = () => {
    const rows = filteredRows();
    const cols = [
      { key: 'platform', name: '平台' },
      { key: 'site', name: '站点' },
      { key: 'dept', name: '刊登部门' },
      { key: 'msku', name: 'MSKU' },
      { key: 'sku', name: 'SKU' },
      { key: 'asin', name: 'ASIN' },
      { key: 'shop', name: '店铺名称' },
      { key: 'list_time', name: '刊登时间' },
      { key: 'dev_time', name: '开发时间' },
      { key: 'label', name: '是否有合规性标签' },
      { key: 'cpc', name: '是否做CPC认证' },
      { key: 'mail_time', name: '收到合规性邮件时间' },
      { key: 'mail_status', name: '邮件处理状态' },
      { key: 'orders', name: '刊登后出单量' },
      { key: 'amount', name: '刊登后销量金额' },
      { key: 'remark', name: '备注' },
      { key: 'cat3', name: '三级类目' },
    ];
    const esc = v => `"${String(v ?? '').replace(/"/g, '""')}"`;
    const csv = [cols.map(c => esc(c.name)).join(',')].concat(
      rows.map(r => cols.map(c => {
        let val = c.key === 'platform' ? (r.platform || '亚马逊') : r[c.key];
        if (c.key === 'mail_time' && isBlankVal(val)) val = '';
        return esc(val);
      }).join(','))
    ).join('\n');
    const blob = new Blob(['\ufeff' + csv], { type: 'text/csv;charset=utf-8' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = '合规看板明细导出.csv';
    a.click();
    toast(`已导出 ${rows.length} 条`);
  };
  document.querySelectorAll('[data-close]').forEach(b => b.onclick = () => document.getElementById('detailOverlay').classList.remove('show'));
  document.getElementById('detailOverlay').addEventListener('click', e => {
    if (e.target.id === 'detailOverlay') e.target.classList.remove('show');
  });

  Object.entries(MULTI_CFG).forEach(([key, cfg]) => {
    document.getElementById(cfg.trigger).onclick = (e) => {
      e.stopPropagation();
      const panel = document.getElementById(cfg.panel);
      const open = panel.classList.contains('show');
      closeAllMultiPanels();
      closeAllBulkPopovers();
      if (!open) panel.classList.add('show');
    };
  });
  document.addEventListener('click', () => {
    closeAllMultiPanels();
    closeAllBulkPopovers();
  });
  document.querySelectorAll('.multi-panel').forEach(p => p.addEventListener('click', e => e.stopPropagation()));
  document.querySelectorAll('.multi-panel').forEach(panel => {
    panel.addEventListener('change', e => {
      const cb = e.target.closest('input[type=checkbox][data-multi]');
      if (cb) updateMultiTrigger(cb.dataset.multi);
    });
    panel.addEventListener('click', e => {
      const act = e.target.closest('[data-act]');
      if (!act) return;
      const key = act.dataset.multi;
      const cfg = MULTI_CFG[key];
      document.querySelectorAll(`#${cfg.panel} input[type=checkbox]`).forEach(el => {
        el.checked = act.dataset.act === 'all';
      });
      updateMultiTrigger(key);
    });
  });

  if (moreFilterKeys().some(filterHasValue)) state.filtersExpanded = true;
  // 决策台下钻：整批带 tab 时映射筛选；点具体 SKU/MSKU/类目时不套出单/邮件条件，避免演示池筛空
  const tabFromUrl = qs.get('tab');
  const hasEntityDrill = state.sku.length > 0 || state.msku.length > 0 || !!state.cat3;
  if (!hasEntityDrill) {
    if (tabFromUrl === 'cpc' && !state.cpc) state.cpc = '是';
    if (tabFromUrl === 'order' && !state.hasOrder) state.hasOrder = '是';
    if (tabFromUrl === 'mail' && !state.mailStatus) state.mailStatus = '__has__';
  } else {
    // 实体下钻：清掉易冲突的象限衍生条件（若 URL 仍带了旧参数）
    state.hasOrder = '';
    state.mailStatus = '';
    state.cpc = '';
  }
  initFilterOptions();
  initMultiSelects();
  initBulkQueryFields();
  syncFiltersToUI();
  // 若仍无结果：再放宽刊登时间（演示池日期可能不全）
  if (hasEntityDrill && filteredRows().length === 0 && (state.listFrom || state.listTo)) {
    state.listFrom = '';
    state.listTo = '';
    syncFiltersToUI();
    toast('已自动放宽刊登时间以展示该对象明细');
  }
  renderList();
  </script>
</body>
</html>
