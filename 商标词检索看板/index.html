<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>商标词&禁用词检索看板 - 风控系统</title>
  <style>
    :root {
      --bg: #f0f2f5; --panel: #fff; --line: #e8ebf0; --text: #1f2733; --sub: #5b6577;
      --muted: #97a0b0; --pri: #2f6bff; --pri-bg: #eaf0ff; --ok: #16b364; --warn: #fa8c16;
      --danger: #f5455c; --header-h: 48px; --side-w: 228px;
    }
    * { box-sizing: border-box; }
    body { margin: 0; font: 13px/1.5 "Microsoft YaHei", "PingFang SC", sans-serif; background: var(--bg); color: var(--text); }

    .header { height: var(--header-h); background: #fff; border-bottom: 1px solid var(--line); display: flex; align-items: center; position: sticky; top: 0; z-index: 30; }
    .brand { width: var(--side-w); flex: none; padding: 0 16px; font-weight: 700; font-size: 15px; border-right: 1px solid var(--line); height: 100%; display: flex; align-items: center; gap: 6px; }
    .page-tabs { flex: 1; display: flex; align-items: flex-end; padding: 0 12px; height: 100%; }
    .ptab { display: flex; align-items: center; padding: 0 14px; height: 36px; margin-top: 11px; border: 1px solid transparent; border-bottom: none; border-radius: 6px 6px 0 0; color: var(--sub); font-size: 13px; }
    .ptab.on { background: var(--bg); border-color: var(--line); color: var(--pri); font-weight: 600; }
    .hdr-tools { flex: none; display: flex; align-items: center; gap: 14px; padding: 0 16px; color: var(--sub); font-size: 16px; }
    .user { display: flex; align-items: center; gap: 8px; font-size: 12px; color: var(--sub); border-left: 1px solid var(--line); padding-left: 14px; }
    .avatar { width: 28px; height: 28px; border-radius: 50%; background: linear-gradient(135deg, #6ea8ff, #2f6bff); color: #fff; display: flex; align-items: center; justify-content: center; font-size: 11px; font-weight: 700; }

    .body { display: flex; min-height: calc(100vh - var(--header-h)); }
    .sidenav { width: var(--side-w); flex: none; background: #fff; border-right: 1px solid var(--line); padding: 8px 0; }
    .nav-item { padding: 10px 14px 10px 18px; color: var(--sub); font-size: 13px; display: flex; align-items: center; gap: 8px; cursor: pointer; }
    .nav-item:hover { background: #f6f8fb; }
    .nav-item.active { background: var(--pri-bg); color: var(--pri); font-weight: 600; border-right: 3px solid var(--pri); }

    .content { flex: 1; padding: 12px; overflow: auto; }
    .page { background: var(--panel); min-height: calc(100vh - var(--header-h) - 24px); border-radius: 4px; }

    .page-hd { padding: 16px 20px 0; display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
    .page-title { font-size: 16px; font-weight: 700; margin: 0; }
    .page-sub { font-size: 12px; color: var(--sub); margin-top: 4px; }
    .site-badge { display: inline-flex; align-items: center; gap: 6px; padding: 4px 10px; background: #f0f5ff; border: 1px solid #adc6ff; border-radius: 4px; font-size: 12px; color: var(--pri); font-weight: 600; }

    .status-row { display: none; }

    .filters { padding: 12px 20px; border-bottom: 1px solid var(--line); }
    .filter-row { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
    .field { display: flex; align-items: stretch; height: 32px; }
    .field.bulk-field { height: auto; min-height: 32px; }
    .field .lbl { background: #f6f8fb; border: 1px solid var(--line); border-right: none; border-radius: 4px 0 0 4px; padding: 0 10px; display: flex; align-items: center; color: var(--sub); white-space: nowrap; font-size: 12px; }
    .ctrl { height: 32px; border: 1px solid var(--line); border-radius: 4px; background: #fff; padding: 0 10px; color: var(--text); font-size: 12px; outline: none; min-width: 120px; }
    .field .ctrl { border-radius: 0 4px 4px 0; }
    select.ctrl { appearance: none; background: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='10' height='10' viewBox='0 0 10 10'><path d='M1 3l4 4 4-4' stroke='%2397a0b0' fill='none' stroke-width='1.4'/></svg>") no-repeat right 9px center; padding-right: 26px; cursor: pointer; }
    .date-sep { color: var(--muted); font-size: 12px; }
    .channel-field { position: relative; height: auto; }
    .channel-field .lbl { height: 32px; }
    .status-field { position: relative; height: auto; }
    .status-field .lbl { height: 32px; }
    .channel-picker { position: relative; }
    .status-picker { position: relative; }
    .channel-trigger {
      min-width: 168px; height: 32px; border: 1px solid var(--line); border-radius: 0 4px 4px 0;
      background: #fff; padding: 0 26px 0 10px; text-align: left; cursor: pointer; font-size: 12px; color: var(--text);
      background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='10' height='10' viewBox='0 0 10 10'><path d='M1 3l4 4 4-4' stroke='%2397a0b0' fill='none' stroke-width='1.4'/></svg>");
      background-repeat: no-repeat; background-position: right 9px center;
    }
    .channel-panel {
      display: none; position: absolute; top: calc(100% + 4px); left: 0; z-index: 40;
      min-width: 280px; max-height: 320px; overflow: auto; background: #fff; border: 1px solid var(--line);
      border-radius: 4px; box-shadow: 0 8px 24px rgba(0,0,0,.12); padding: 8px 0;
    }
    .channel-panel.show { display: block; }
    .status-panel {
      display: none; position: absolute; top: calc(100% + 4px); left: 0; z-index: 40;
      min-width: 220px; max-height: 320px; overflow: auto; background: #fff; border: 1px solid var(--line);
      border-radius: 4px; box-shadow: 0 8px 24px rgba(0,0,0,.12); padding: 8px 0;
    }
    .status-panel.show { display: block; }
    .status-opt { display: flex; align-items: center; gap: 8px; padding: 6px 12px; font-size: 12px; cursor: pointer; user-select: none; }
    .status-opt:hover { background: #f6f8fb; }
    .status-opt input { margin: 0; cursor: pointer; }
    .status-opt .cnt { margin-left: auto; color: var(--muted); font-size: 11px; }
    .tree-row {
      display: flex; align-items: center; gap: 6px; padding: 6px 12px; font-size: 12px; cursor: pointer; user-select: none;
    }
    .tree-row:hover { background: #f6f8fb; }
    .tree-row input { cursor: pointer; margin: 0; }
    .tree-arrow { width: 14px; color: var(--muted); font-size: 10px; text-align: center; flex: none; cursor: pointer; }
    .tree-arrow.collapsed::before { content: "▸"; }
    .tree-arrow.open::before { content: "▾"; }
    .tree-children { padding-left: 18px; }
    .tree-children.hidden { display: none; }
    .tree-leaf { padding-left: 8px; }
    .btn { height: 32px; border: 1px solid var(--line); background: #fff; border-radius: 4px; padding: 0 14px; cursor: pointer; font-size: 12px; }
    .btn.pri { background: var(--pri); border-color: var(--pri); color: #fff; }

    .sku-query-wrap { display: flex; align-items: stretch; flex: 1; min-width: 140px; height: 32px; border: 1px solid var(--line); border-radius: 0 4px 4px 0; background: #fff; }
    .sku-query-input-cell { position: relative; flex: 1; display: flex; align-items: center; min-width: 120px; }
    .sku-query-input { border: none; box-shadow: none; flex: 1; height: 30px; padding: 0 10px; font-size: 12px; outline: none; background: transparent; min-width: 0; }
    .sku-query-more {
      flex: none; width: 30px; height: 30px; border: none; border-left: 1px solid var(--line); background: #fff;
      color: var(--sub); cursor: pointer; font-size: 16px; line-height: 1; letter-spacing: -2px;
    }
    .sku-query-more:hover { color: var(--pri); background: #f6f8fb; }
    .sku-query-popover {
      display: none; position: absolute; top: calc(100% + 4px); right: 0; z-index: 50;
      width: min(340px, 88vw); background: #fff; border: 1px solid var(--line); border-radius: 6px;
      box-shadow: 0 8px 24px rgba(0,0,0,.12); padding: 12px;
    }
    .sku-query-popover.show { display: block; }
    .sku-query-popover textarea {
      width: 100%; min-height: 128px; border: 1px solid var(--line); border-radius: 4px;
      padding: 8px 10px; font: 12px/1.55 inherit; resize: vertical; outline: none; box-sizing: border-box;
    }
    .sku-query-popfoot { display: flex; justify-content: flex-end; gap: 8px; margin-top: 10px; }

    .toolbar { display: flex; align-items: center; gap: 12px; padding: 10px 20px; font-size: 12px; color: var(--sub); }
    .toolbar .spacer { flex: 1; }

    .table-wrap { padding: 0 20px 20px; overflow-x: auto; }
    table { width: 100%; border-collapse: collapse; min-width: 1380px; font-size: 12px; }
    thead th { background: #f6f8fb; color: var(--sub); font-weight: 600; text-align: left; padding: 10px; border-bottom: 1px solid var(--line); white-space: nowrap; }
    tbody td { padding: 11px 10px; border-bottom: 1px solid var(--line); vertical-align: top; }
    tbody tr:hover { background: #fafbfd; }
    tbody tr.row-pending { background: #fffbf5; }

    .listing-info .row { font-size: 12px; line-height: 1.75; color: var(--sub); }
    .listing-info .row b { color: var(--text); font-weight: 500; min-width: 88px; display: inline-block; }
    .listing-info .msku { color: var(--pri); font-weight: 600; }
    .msku-link { color: var(--pri); font-weight: 600; cursor: pointer; text-decoration: underline; text-underline-offset: 2px; }
    .msku-link:hover { color: #1a52d4; }

    .overlay {
      display: none; position: fixed; inset: 0; background: rgba(0,0,0,.45);
      z-index: 100; align-items: center; justify-content: center; padding: 20px;
    }
    .overlay.show { display: flex; }
    .modal {
      width: 920px; max-width: 96vw; max-height: 88vh; background: #fff; border-radius: 8px;
      box-shadow: 0 12px 40px rgba(0,0,0,.18); display: flex; flex-direction: column; overflow: hidden;
    }
    .modal-hd {
      padding: 14px 18px; border-bottom: 1px solid var(--line); display: flex; align-items: center; gap: 10px;
      font-size: 14px; font-weight: 600;
    }
    .modal-hd .sub { font-size: 12px; color: var(--sub); font-weight: 400; }
    .modal-hd .x { margin-left: auto; cursor: pointer; color: var(--muted); font-size: 20px; line-height: 1; border: none; background: none; }
    .modal-hd .x:hover { color: var(--text); }
    .modal-bd { padding: 0; overflow: auto; flex: 1; }
    .cmp-head {
      display: grid; grid-template-columns: 110px 1fr 1fr; background: #f6f8fb; border-bottom: 1px solid var(--line);
      font-size: 12px; font-weight: 600; color: var(--sub);
    }
    .cmp-head > div { padding: 10px 14px; }
    .cmp-head .col-v2 { color: #2f6bff; border-left: 1px solid var(--line); }
    .cmp-head .col-es { color: #722ed1; border-left: 1px solid var(--line); }
    .cmp-row {
      display: grid; grid-template-columns: 110px 1fr 1fr; border-bottom: 1px solid var(--line); font-size: 12px;
    }
    .cmp-row:last-child { border-bottom: none; }
    .cmp-label { padding: 12px 14px; background: #fafbfd; color: var(--sub); font-weight: 600; border-right: 1px solid var(--line); }
    .cmp-cell { padding: 12px 14px; line-height: 1.65; word-break: break-word; white-space: pre-wrap; border-left: 1px solid var(--line); }
    .cmp-cell.diff { background: #fffbe6; }
    .modal-ft { padding: 12px 18px; border-top: 1px solid var(--line); display: flex; justify-content: flex-end; }

    .tag { display: inline-block; padding: 1px 7px; border-radius: 3px; font-size: 11px; line-height: 18px; white-space: nowrap; }
    .st-待处理 { background: #fff7e6; color: var(--warn); }
    .st-已提交待确认 { background: #e6f4ff; color: var(--pri); }
    .st-无需处理 { background: #f5f5f5; color: var(--sub); }
    .st-处理成功 { background: #f0f9f3; color: var(--ok); }
    .st-处理失败 { background: #fff1f0; color: var(--danger); }
    .st-业务自处理 { background: #f9f0ff; color: #722ed1; }
    .st-已替换 { background: #e6fffb; color: #13c2c2; }
    .type-tm { background: #fff1f0; color: var(--danger); border: 1px solid #ffccc7; }
    .type-ban { background: #fff7e6; color: var(--warn); border: 1px solid #ffd591; }
    .shop-pause { color: var(--warn); font-weight: 600; }
    .shop-normal { color: var(--ok); }
    .channel-on { color: var(--ok); font-weight: 600; }
    .channel-off { color: var(--warn); font-weight: 600; }
    .yes { color: var(--danger); font-weight: 600; }
    .no { color: var(--ok); }
    .word { font-weight: 600; color: var(--danger); }
    .word-num { font-weight: 600; color: var(--text); font-variant-numeric: tabular-nums; }
    .word-disp-删除 { background: #fff1f0; color: var(--danger); }
    .word-disp-保留 { background: #f0f9f3; color: var(--ok); }
    .word-disp-替换 { background: #e6fffb; color: #13c2c2; }
    .word-disp-未配置 { background: #f5f5f5; color: var(--sub); }
    .empty { color: var(--muted); }
    .fail-info { max-width: 220px; font-size: 11px; line-height: 1.55; color: var(--sub); word-break: break-all; }
    .fail-info.has-err { color: var(--danger); }

    .pager { display: flex; align-items: center; justify-content: flex-end; gap: 8px; padding: 12px 20px 16px; font-size: 12px; color: var(--sub); }
    .toast { position: fixed; top: 24px; left: 50%; transform: translateX(-50%); background: #1f2733; color: #fff; padding: 10px 18px; border-radius: 8px; z-index: 200; opacity: 0; transition: .25s; pointer-events: none; }
    .toast.show { opacity: 1; top: 34px; }
  </style>
</head>
<body>

<header class="header">
  <div class="brand">风控系统 <span style="color:var(--muted);font-size:10px">▾</span></div>
  <div class="page-tabs"><div class="ptab on">商标词&禁用词检索看板</div></div>
  <div class="hdr-tools">
    <span>?</span><span>↓</span><span>🔔</span>
    <div class="user"><div class="avatar">袁</div><span>袁效国（IRMS-产品）</span></div>
  </div>
</header>

<div class="body">
  <nav class="sidenav">
    <div class="nav-item">📋 新品风险审核</div>
    <div class="nav-item">📦 样品管理</div>
    <div class="nav-item">⚖ 专利管理</div>
    <div class="nav-item">© 版权管理</div>
    <div class="nav-item active">📊 商标词&禁用词检索看板</div>
  </nav>

  <main class="content">
    <div class="page">
      <div class="page-hd">
        <div>
          <h1 class="page-title">商标词&禁用词检索看板</h1>
          <p class="page-sub">美国站检索记录</p>
        </div>
        <div class="site-badge">🇺🇸 Amazon US</div>
      </div>

      <div class="filters">
        <div class="filter-row">
          <div class="field status-field"><span class="lbl">处理状态</span>
            <div class="status-picker" id="statusPicker">
              <button type="button" class="channel-trigger" id="statusTrigger">全部处理状态</button>
              <div class="status-panel" id="statusPanel"></div>
            </div>
          </div>
          <div class="field bulk-field"><span class="lbl">MSKU</span>
            <div class="sku-query-wrap" id="mskuQuery" data-max="500" data-unit="MSKU">
              <div class="sku-query-input-cell">
                <input type="text" class="sku-query-input" placeholder="请输入MSKU" />
                <button type="button" class="sku-query-more" title="批量输入" aria-label="批量输入MSKU">⋮</button>
                <div class="sku-query-popover">
                  <textarea placeholder="一行一项，支持粘贴；回车换行"></textarea>
                  <div class="sku-query-popfoot">
                    <button type="button" class="btn" data-sku-act="clear">清空</button>
                    <button type="button" class="btn pri" data-sku-act="ok">确定</button>
                  </div>
                </div>
              </div>
            </div>
          </div>
          <div class="field bulk-field"><span class="lbl">SKU</span>
            <div class="sku-query-wrap" id="skuQuery" data-max="500" data-unit="SKU">
              <div class="sku-query-input-cell">
                <input type="text" class="sku-query-input" placeholder="请输入SKU" />
                <button type="button" class="sku-query-more" title="批量输入" aria-label="批量输入SKU">⋮</button>
                <div class="sku-query-popover">
                  <textarea placeholder="一行一项，支持粘贴；回车换行"></textarea>
                  <div class="sku-query-popfoot">
                    <button type="button" class="btn" data-sku-act="clear">清空</button>
                    <button type="button" class="btn pri" data-sku-act="ok">确定</button>
                  </div>
                </div>
              </div>
            </div>
          </div>
          <div class="field"><span class="lbl">检索词</span><input class="ctrl" id="fWord" placeholder="如 NINJA" /></div>
          <div class="field"><span class="lbl">检索类型</span>
            <select class="ctrl" id="fType"><option value="">全部</option><option>商标词</option><option>禁用词</option></select>
          </div>
          <div class="field"><span class="lbl">词处理方式</span>
            <select class="ctrl" id="fWordDispose"><option value="">全部</option><option>删除</option><option>保留</option><option>替换</option><option>未配置</option></select>
          </div>
          <div class="field channel-field"><span class="lbl">来源渠道</span>
            <div class="channel-picker" id="channelPicker">
              <button type="button" class="channel-trigger" id="channelTrigger">全部来源渠道</button>
              <div class="channel-panel" id="channelPanel">
                <label class="tree-row">
                  <span class="tree-arrow open" data-target="treePlatform"></span>
                  <input type="checkbox" id="chPlatform" data-role="group" data-target="platform" />
                  <span>亚马逊平台</span>
                </label>
                <div class="tree-children" id="treePlatform">
                  <label class="tree-row">
                    <span class="tree-arrow open" data-target="treeUS"></span>
                    <input type="checkbox" id="chUS" data-role="group" data-target="us" />
                    <span>United States（美国）</span>
                  </label>
                  <div class="tree-children" id="treeUS"></div>
                </div>
              </div>
            </div>
          </div>
          <div class="field"><span class="lbl">店铺状态</span>
            <select class="ctrl" id="fShop"><option value="">全部</option><option>暂停</option><option>正常</option></select>
          </div>
          <div class="field"><span class="lbl">渠道是否开启</span>
            <select class="ctrl" id="fChannel"><option value="">全部</option><option>是</option><option>否</option></select>
          </div>
          <div class="field"><span class="lbl">检索时间</span><input class="ctrl" type="date" id="fDateFrom" value="2026-05-17" /></div>
          <span class="date-sep">—</span>
          <input class="ctrl" type="date" id="fDateTo" value="2026-05-18" style="border-radius:4px" />
          <button class="btn pri" id="btnSearch">查询</button>
          <button class="btn" id="btnReset">重置</button>
        </div>
      </div>

      <div class="toolbar">
        <span>当前展示 <b id="resultCount">0</b> 条检索记录</span>
      </div>

      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th style="width:260px">Listing 信息</th>
              <th style="width:220px">时间信息</th>
              <th>处理状态</th>
              <th>检索词</th>
              <th>词处理方式</th>
              <th>词检索listing数量</th>
              <th>检索类型</th>
              <th>渠道是否开启</th>
              <th style="min-width:200px">删除错误信息</th>
            </tr>
          </thead>
          <tbody id="tableBody"></tbody>
        </table>
      </div>

      <div class="pager">
        <span>每页 20 条</span>
        <button disabled>‹</button><button class="on" style="background:var(--pri);color:#fff;border-color:var(--pri)">1</button><button disabled>›</button>
      </div>
    </div>
  </main>
</div>

<div class="toast" id="toast"></div>

<div class="overlay" id="listingOverlay">
  <div class="modal" role="dialog" aria-modal="true" aria-labelledby="listingModalTitle">
    <div class="modal-hd">
      <span id="listingModalTitle">Listing 文案</span>
      <span class="sub" id="listingModalSub"></span>
      <button type="button" class="x" id="listingModalClose" aria-label="关闭">×</button>
    </div>
    <div class="modal-bd" id="listingModalBody"></div>
    <div class="modal-ft"><button class="btn pri" id="listingModalOk">关闭</button></div>
  </div>
</div>

<script src="sample-data.js"></script>
<script>
const DATA = window.TRADEMARK_SEARCH_DATA;
const ALL_STATUS = ["待处理", "已提交待确认", "无需处理", "处理成功", "处理失败", "业务自处理", "已替换"];
const STATUS_COUNTS = DATA.meta.statusCountsFull;
const LISTINGS = DATA.listings || {};

const LISTING_FIELDS = [
  { key: "title", label: "标题" },
  { key: "keywords", label: "关键词" },
  { key: "desc", label: "描述" },
  { key: "bullets", label: "亮点" },
];

let records = [...DATA.records];
let filtered = [...records];

function toast(msg) {
  const t = document.getElementById("toast");
  t.textContent = msg;
  t.classList.add("show");
  setTimeout(() => t.classList.remove("show"), 1800);
}

function esc(s) {
  return String(s ?? "").replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
}

function wordDisposeLabel(v) {
  const s = String(v ?? "").trim();
  return s || "未配置";
}

function closeAllBulkPopovers() {
  document.querySelectorAll(".sku-query-popover.show").forEach(p => p.classList.remove("show"));
}

function parseBulkLines(text, max) {
  const lines = (text || "").split(/\r?\n/).map(s => s.trim()).filter(Boolean);
  const unique = [...new Set(lines)];
  if (unique.length > max) return { items: unique.slice(0, max), truncated: true };
  return { items: unique, truncated: false };
}

function bulkUnit(wrap) {
  return wrap.dataset.unit || "项";
}

function setBulkQuery(wrap, items) {
  if (!wrap || !items?.length) return;
  const max = parseInt(wrap.dataset.max || "500", 10);
  const list = items.slice(0, max);
  const ta = wrap.querySelector(".sku-query-popover textarea");
  const input = wrap.querySelector(".sku-query-input");
  const unit = bulkUnit(wrap);
  if (ta) ta.value = list.join("\n");
  if (input) {
    input.value = list.length === 1 ? list[0] : `${list.length}个${unit}`;
    input.dataset.skuBulk = list.join("\n");
  }
}

function applyBulkQuery(wrap) {
  if (!wrap) return [];
  const max = parseInt(wrap.dataset.max || "500", 10);
  const ta = wrap.querySelector(".sku-query-popover textarea");
  const input = wrap.querySelector(".sku-query-input");
  const unit = bulkUnit(wrap);
  const { items, truncated } = parseBulkLines(ta?.value || "", max);
  if (!items.length) {
    toast(`请输入至少一个 ${unit}`);
    return [];
  }
  if (input) {
    input.value = items.length === 1 ? items[0] : `${items.length}个${unit}`;
    input.dataset.skuBulk = items.join("\n");
  }
  closeAllBulkPopovers();
  if (truncated) toast(`最多 ${max} 个，已截取前 ${max} 个`);
  else toast(`已填入 ${items.length} 个 ${unit} 用于查询`);
  return items;
}

function resetBulkQuery(wrap) {
  if (!wrap) return;
  const ta = wrap.querySelector(".sku-query-popover textarea");
  const input = wrap.querySelector(".sku-query-input");
  if (ta) ta.value = "";
  if (input) {
    input.value = "";
    delete input.dataset.skuBulk;
  }
}

function getBulkFilter(wrapId, normalize = s => s) {
  const wrap = document.getElementById(wrapId);
  const input = wrap?.querySelector(".sku-query-input");
  if (!input) return { mode: "none", list: [] };
  if (input.dataset.skuBulk) {
    const list = input.dataset.skuBulk.split("\n").map(s => normalize(s.trim())).filter(Boolean);
    return { mode: "bulk", list };
  }
  const v = input.value.trim();
  if (!v || /^\d+个/.test(v)) return { mode: "none", list: [] };
  return { mode: "single", list: [normalize(v)] };
}

function initBulkQueryFields() {
  document.querySelectorAll(".sku-query-wrap").forEach(wrap => {
    const more = wrap.querySelector(".sku-query-more");
    const pop = wrap.querySelector(".sku-query-popover");
    const input = wrap.querySelector(".sku-query-input");

    more?.addEventListener("click", e => {
      e.stopPropagation();
      const wasOpen = pop?.classList.contains("show");
      closeAllBulkPopovers();
      if (!wasOpen) {
        pop?.classList.add("show");
        wrap.querySelector(".sku-query-popover textarea")?.focus();
      }
    });

    wrap.querySelector('[data-sku-act="clear"]')?.addEventListener("click", e => {
      e.stopPropagation();
      resetBulkQuery(wrap);
    });

    wrap.querySelector('[data-sku-act="ok"]')?.addEventListener("click", e => {
      e.stopPropagation();
      applyBulkQuery(wrap);
    });

    input?.addEventListener("input", () => {
      if (!input.value.trim()) delete input.dataset.skuBulk;
    });
  });

  document.addEventListener("click", e => {
    if (!e.target.closest(".sku-query-wrap")) closeAllBulkPopovers();
  });
}

function initStatusFilter() {
  const panel = document.getElementById("statusPanel");
  panel.innerHTML = ALL_STATUS.map(st => `
    <label class="status-opt">
      <input type="checkbox" class="ch-status" value="${esc(st)}" />
      <span>${esc(st)}</span>
      <span class="cnt">${(STATUS_COUNTS[st] || 0).toLocaleString()}</span>
    </label>
  `).join("");
  bindStatusFilter();
}

function getSelectedStatuses() {
  return Array.from(document.querySelectorAll(".ch-status:checked")).map(el => el.value);
}

function updateStatusTrigger() {
  const selected = getSelectedStatuses();
  document.getElementById("statusTrigger").textContent = selected.length
    ? `已选 ${selected.length} 个状态`
    : "全部处理状态";
}

function resetStatusFilter() {
  document.querySelectorAll(".ch-status").forEach(b => { b.checked = false; });
  document.getElementById("statusTrigger").textContent = "全部处理状态";
  document.getElementById("statusPanel").classList.remove("show");
}

function bindStatusFilter() {
  const picker = document.getElementById("statusPicker");
  const panel = document.getElementById("statusPanel");
  const trigger = document.getElementById("statusTrigger");

  panel.querySelectorAll(".ch-status").forEach(box => {
    box.onchange = updateStatusTrigger;
  });

  trigger.onclick = e => {
    e.stopPropagation();
    panel.classList.toggle("show");
  };

  panel.onclick = e => e.stopPropagation();

  document.addEventListener("click", e => {
    if (!picker.contains(e.target)) panel.classList.remove("show");
  });

  updateStatusTrigger();
}

function initChannelFilter() {
  const treeUS = document.getElementById("treeUS");
  const channels = [...new Set(records.map(r => r.sourceChannel).filter(Boolean))].sort();
  treeUS.innerHTML = channels.map(c => `
    <label class="tree-row tree-leaf">
      <span class="tree-arrow" style="visibility:hidden">▸</span>
      <input type="checkbox" class="ch-shop" value="${esc(c)}" data-role="shop" />
      <span>${esc(c)}</span>
    </label>
  `).join("");
  bindChannelTree();
}

function bindChannelTree() {
  const panel = document.getElementById("channelPanel");
  const trigger = document.getElementById("channelTrigger");
  const shopBoxes = () => Array.from(document.querySelectorAll(".ch-shop"));
  const chPlatform = document.getElementById("chPlatform");
  const chUS = document.getElementById("chUS");

  function setGroupChecked(boxes, checked) {
    boxes.forEach(b => { b.checked = checked; b.indeterminate = false; });
  }

  function syncParentState(parent, children) {
    const checked = children.filter(c => c.checked).length;
    parent.indeterminate = checked > 0 && checked < children.length;
    parent.checked = checked === children.length && children.length > 0;
  }

  function updateTrigger() {
    const selected = getSelectedChannels();
    trigger.textContent = selected.length ? `已选 ${selected.length} 个渠道` : "全部来源渠道";
  }

  chPlatform.onchange = () => {
    const on = chPlatform.checked;
    chPlatform.indeterminate = false;
    chUS.checked = on;
    chUS.indeterminate = false;
    setGroupChecked(shopBoxes(), on);
    updateTrigger();
  };

  chUS.onchange = () => {
    const on = chUS.checked;
    chUS.indeterminate = false;
    setGroupChecked(shopBoxes(), on);
    syncParentState(chPlatform, [chUS, ...shopBoxes()]);
    updateTrigger();
  };

  shopBoxes().forEach(box => {
    box.onchange = () => {
      syncParentState(chUS, shopBoxes());
      chPlatform.checked = chUS.checked && shopBoxes().every(s => s.checked);
      chPlatform.indeterminate = !chPlatform.checked && (chUS.indeterminate || chUS.checked || shopBoxes().some(s => s.checked));
      updateTrigger();
    };
  });

  panel.querySelectorAll("[data-target]").forEach(arrow => {
    arrow.onclick = e => {
      e.preventDefault();
      e.stopPropagation();
      const target = document.getElementById(arrow.dataset.target);
      const collapsed = target.classList.toggle("hidden");
      arrow.classList.toggle("open", !collapsed);
      arrow.classList.toggle("collapsed", collapsed);
    };
  });

  trigger.onclick = e => {
    e.stopPropagation();
    panel.classList.toggle("show");
  };

  document.addEventListener("click", e => {
    if (!document.getElementById("channelPicker").contains(e.target)) {
      panel.classList.remove("show");
    }
  });

  panel.onclick = e => e.stopPropagation();
  updateTrigger();
}

function getSelectedChannels() {
  return Array.from(document.querySelectorAll(".ch-shop:checked")).map(el => el.value);
}

function resetChannelFilter() {
  document.getElementById("chPlatform").checked = false;
  document.getElementById("chPlatform").indeterminate = false;
  document.getElementById("chUS").checked = false;
  document.getElementById("chUS").indeterminate = false;
  document.querySelectorAll(".ch-shop").forEach(b => { b.checked = false; });
  document.getElementById("channelTrigger").textContent = "全部来源渠道";
  document.getElementById("channelPanel").classList.remove("show");
}

function parseDetectDate(str) {
  if (!str) return null;
  const d = new Date(String(str).replace(" ", "T"));
  return Number.isNaN(d.getTime()) ? null : d;
}

function getListingContent(record) {
  const key = record.listingKey || `${record.sourceChannel}-${record.msku}`;
  if (LISTINGS[key]) return LISTINGS[key];
  const w = record.word || "Product";
  return {
    v2: {
      title: `${w} Professional Listing Title (V2)`,
      keywords: `${w};keyword;listing;amazon`,
      desc: `V2 description for ${record.msku}. Contains detected word: ${w}.`,
      bullets: `Highlight 1 with ${w}\nHighlight 2\nHighlight 3`,
    },
    es: {
      title: "Professional Listing Title (ES)",
      keywords: "keyword;listing;amazon;product",
      desc: `ES description for ${record.msku}. May differ from V2 snapshot.`,
      bullets: "Highlight 1\nHighlight 2\nHighlight 3",
    },
  };
}

function closeListingModal() {
  document.getElementById("listingOverlay").classList.remove("show");
}

function openListingModal(record) {
  const content = getListingContent(record);
  document.getElementById("listingModalTitle").textContent = "Listing 文案对比";
  document.getElementById("listingModalSub").textContent = `MSKU：${record.msku} · ${record.shopName || ""}`;
  document.getElementById("listingModalBody").innerHTML = `
    <div class="cmp-head">
      <div>字段</div>
      <div class="col-v2">V2</div>
      <div class="col-es">ES</div>
    </div>
    ${LISTING_FIELDS.map(f => {
      const v2 = content.v2?.[f.key] || "—";
      const es = content.es?.[f.key] || "—";
      const diff = String(v2).trim() !== String(es).trim();
      return `
        <div class="cmp-row">
          <div class="cmp-label">${f.label}</div>
          <div class="cmp-cell ${diff ? "diff" : ""}">${esc(v2)}</div>
          <div class="cmp-cell ${diff ? "diff" : ""}">${esc(es)}</div>
        </div>`;
    }).join("")}
  `;
  document.getElementById("listingOverlay").classList.add("show");
}

function bindMskuClicks() {
  document.querySelectorAll(".msku-link").forEach(el => {
    el.onclick = e => {
      e.preventDefault();
      const idx = +el.dataset.idx;
      openListingModal(filtered[idx]);
    };
  });
}

function renderTable() {
  const tbody = document.getElementById("tableBody");
  tbody.innerHTML = filtered.map((r, idx) => {
    const disp = wordDisposeLabel(r.wordDispose);
    return `
    <tr class="${r.dealStatus === "待处理" ? "row-pending" : ""}">
      <td>
        <div class="listing-info">
          <div class="row"><b>MSKU</b><span class="msku-link" data-idx="${idx}" title="点击查看 Listing 文案">${esc(r.msku)}</span></div>
          <div class="row"><b>店铺名称</b>${esc(r.shopName)}</div>
          <div class="row"><b>SKU</b>${esc(r.sku)}</div>
          <div class="row"><b>店铺状态</b><span class="${r.shopStatus === "暂停" ? "shop-pause" : "shop-normal"}">${esc(r.shopStatus)}</span></div>
          <div class="row"><b>业务员</b>${esc(r.salesman)}</div>
        </div>
      </td>
      <td>
        <div class="listing-info">
          <div class="row"><b>检索时间</b>${esc(r.detectTime) || '<span class="empty">—</span>'}</div>
          <div class="row"><b>添加时间</b>${esc(r.addTime) || '<span class="empty">—</span>'}</div>
          <div class="row"><b>设置处置时间</b>${esc(r.setDisposeTime) || '<span class="empty">—</span>'}</div>
          <div class="row"><b>处理时间</b>${esc(r.dealTime) || '<span class="empty">—</span>'}</div>
        </div>
      </td>
      <td><span class="tag st-${esc(r.dealStatus)}">${esc(r.dealStatus)}</span></td>
      <td><span class="word">${esc(r.word)}</span></td>
      <td><span class="tag word-disp-${esc(disp)}">${esc(disp)}</span></td>
      <td><span class="word-num">${Number(r.wordListingNum ?? 0).toLocaleString()}</span></td>
      <td><span class="tag ${r.wordType === "商标词" ? "type-tm" : "type-ban"}">${esc(r.wordType)}</span></td>
      <td><span class="${r.channelEnabled === "是" ? "channel-on" : "channel-off"}">${esc(r.channelEnabled || "否")}</span></td>
      <td>${r.deleteErrorInfo ? `<span class="fail-info has-err" title="${esc(r.deleteErrorInfo)}">${esc(r.deleteErrorInfo)}</span>` : '<span class="fail-info empty">—</span>'}</td>
    </tr>
  `;
  }).join("");
  document.getElementById("resultCount").textContent = filtered.length;
  bindMskuClicks();
}

function applyFilters() {
  const mskuFilter = getBulkFilter("mskuQuery", s => s.toUpperCase());
  const skuFilter = getBulkFilter("skuQuery");
  const word = document.getElementById("fWord").value.trim().toUpperCase();
  const type = document.getElementById("fType").value;
  const wordDispose = document.getElementById("fWordDispose").value;
  const shop = document.getElementById("fShop").value;
  const channel = document.getElementById("fChannel").value;
  const channels = getSelectedChannels();
  const statuses = getSelectedStatuses();
  const dateFrom = document.getElementById("fDateFrom").value;
  const dateTo = document.getElementById("fDateTo").value;

  filtered = records.filter(r => {
    if (statuses.length && !statuses.includes(r.dealStatus)) return false;
    if (mskuFilter.mode === "bulk") {
      if (!mskuFilter.list.includes(r.msku.toUpperCase())) return false;
    } else if (mskuFilter.mode === "single") {
      if (!r.msku.toUpperCase().includes(mskuFilter.list[0])) return false;
    }
    if (skuFilter.mode === "bulk") {
      if (!skuFilter.list.includes(String(r.sku))) return false;
    } else if (skuFilter.mode === "single") {
      if (!String(r.sku).includes(skuFilter.list[0])) return false;
    }
    if (word && !r.word.toUpperCase().includes(word)) return false;
    if (type && r.wordType !== type) return false;
    if (wordDispose && wordDisposeLabel(r.wordDispose) !== wordDispose) return false;
    if (channels.length && !channels.includes(r.sourceChannel)) return false;
    if (shop && r.shopStatus !== shop) return false;
    if (channel && (r.channelEnabled || "否") !== channel) return false;
    const detectDate = parseDetectDate(r.detectTime);
    if (dateFrom && detectDate) {
      const from = new Date(dateFrom + "T00:00:00");
      if (detectDate < from) return false;
    }
    if (dateTo && detectDate) {
      const to = new Date(dateTo + "T23:59:59");
      if (detectDate > to) return false;
    }
    return true;
  });
  renderTable();
}

document.getElementById("btnSearch").onclick = () => {
  document.querySelectorAll(".sku-query-wrap").forEach(wrap => {
    const ta = wrap.querySelector(".sku-query-popover textarea");
    if (ta?.value.trim()) applyBulkQuery(wrap);
  });
  applyFilters();
  toast("已筛选");
};
document.getElementById("listingModalClose").onclick = closeListingModal;
document.getElementById("listingModalOk").onclick = closeListingModal;
document.getElementById("listingOverlay").onclick = e => {
  if (e.target.id === "listingOverlay") closeListingModal();
};
document.addEventListener("keydown", e => {
  if (e.key === "Escape") closeListingModal();
});
document.getElementById("btnReset").onclick = () => {
  resetBulkQuery(document.getElementById("mskuQuery"));
  resetBulkQuery(document.getElementById("skuQuery"));
  document.getElementById("fWord").value = "";
  ["fType","fWordDispose","fShop","fChannel"].forEach(id => document.getElementById(id).value = "");
  document.getElementById("fDateFrom").value = "2026-05-17";
  document.getElementById("fDateTo").value = "2026-05-18";
  resetChannelFilter();
  resetStatusFilter();
  filtered = [...records];
  renderTable();
};

initBulkQueryFields();
initStatusFilter();
initChannelFilter();
renderTable();
</script>
</body>
</html>
