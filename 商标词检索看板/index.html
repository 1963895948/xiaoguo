<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>商标词&禁用词检索看板 - 风控系统</title>
  <style>
    :root {
      --bg: #f0f2f5; --panel: #fff; --line: #e8ebf0; --text: #1f2733; --sub: #5b6577;
      --muted: #97a0b0; --pri: #2f6bff; --pri-bg: #eaf0ff; --ok: #16b364; --warn: #fa8c16;
      --danger: #f5455c; --header-h: 48px; --side-w: 228px;
    }
    * { box-sizing: border-box; }
    body { margin: 0; font: 13px/1.5 "Microsoft YaHei", "PingFang SC", sans-serif; background: var(--bg); color: var(--text); }

    .header { height: var(--header-h); background: #fff; border-bottom: 1px solid var(--line); display: flex; align-items: center; position: sticky; top: 0; z-index: 30; }
    .brand { width: var(--side-w); flex: none; padding: 0 16px; font-weight: 700; font-size: 15px; border-right: 1px solid var(--line); height: 100%; display: flex; align-items: center; gap: 6px; }
    .page-tabs { flex: 1; display: flex; align-items: flex-end; padding: 0 12px; height: 100%; }
    .ptab { display: flex; align-items: center; padding: 0 14px; height: 36px; margin-top: 11px; border: 1px solid transparent; border-bottom: none; border-radius: 6px 6px 0 0; color: var(--sub); font-size: 13px; }
    .ptab.on { background: var(--bg); border-color: var(--line); color: var(--pri); font-weight: 600; }
    .hdr-tools { flex: none; display: flex; align-items: center; gap: 14px; padding: 0 16px; color: var(--sub); font-size: 16px; }
    .user { display: flex; align-items: center; gap: 8px; font-size: 12px; color: var(--sub); border-left: 1px solid var(--line); padding-left: 14px; }
    .avatar { width: 28px; height: 28px; border-radius: 50%; background: linear-gradient(135deg, #6ea8ff, #2f6bff); color: #fff; display: flex; align-items: center; justify-content: center; font-size: 11px; font-weight: 700; }

    .body { display: flex; min-height: calc(100vh - var(--header-h)); }
    .sidenav { width: var(--side-w); flex: none; background: #fff; border-right: 1px solid var(--line); padding: 8px 0; }
    .nav-item { padding: 10px 14px 10px 18px; color: var(--sub); font-size: 13px; display: flex; align-items: center; gap: 8px; cursor: pointer; }
    .nav-item:hover { background: #f6f8fb; }
    .nav-item.active { background: var(--pri-bg); color: var(--pri); font-weight: 600; border-right: 3px solid var(--pri); }

    .content { flex: 1; padding: 12px; overflow: auto; }
    .page { background: var(--panel); min-height: calc(100vh - var(--header-h) - 24px); border-radius: 4px; }

    .page-hd { padding: 16px 20px 0; display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
    .page-title { font-size: 16px; font-weight: 700; margin: 0; }
    .page-sub { font-size: 12px; color: var(--sub); margin-top: 4px; }
    .site-badge { display: inline-flex; align-items: center; gap: 6px; padding: 4px 10px; background: #f0f5ff; border: 1px solid #adc6ff; border-radius: 4px; font-size: 12px; color: var(--pri); font-weight: 600; }

    .status-row { display: flex; flex-wrap: wrap; gap: 8px; padding: 14px 20px; border-bottom: 1px solid var(--line); }
    .status-chip {
      display: inline-flex; align-items: center; gap: 6px; padding: 6px 12px;
      border: 1px solid var(--line); border-radius: 6px; background: #fff; cursor: pointer; font-size: 12px; transition: .15s;
    }
    .status-chip:hover { border-color: var(--pri); }
    .status-chip.on { border-color: var(--pri); background: #f5f8ff; color: var(--pri); font-weight: 600; }
    .status-chip .cnt { color: var(--muted); font-weight: 400; }
    .status-chip.on .cnt { color: var(--pri); opacity: .75; }

    .filters { padding: 12px 20px; border-bottom: 1px solid var(--line); }
    .filter-row { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
    .field { display: flex; align-items: stretch; height: 32px; }
    .field .lbl { background: #f6f8fb; border: 1px solid var(--line); border-right: none; border-radius: 4px 0 0 4px; padding: 0 10px; display: flex; align-items: center; color: var(--sub); white-space: nowrap; font-size: 12px; }
    .ctrl { height: 32px; border: 1px solid var(--line); border-radius: 4px; background: #fff; padding: 0 10px; color: var(--text); font-size: 12px; outline: none; min-width: 120px; }
    .field .ctrl { border-radius: 0 4px 4px 0; }
    select.ctrl { appearance: none; background: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='10' height='10' viewBox='0 0 10 10'><path d='M1 3l4 4 4-4' stroke='%2397a0b0' fill='none' stroke-width='1.4'/></svg>") no-repeat right 9px center; padding-right: 26px; cursor: pointer; }
    .btn { height: 32px; border: 1px solid var(--line); background: #fff; border-radius: 4px; padding: 0 14px; cursor: pointer; font-size: 12px; }
    .btn.pri { background: var(--pri); border-color: var(--pri); color: #fff; }

    .toolbar { display: flex; align-items: center; gap: 12px; padding: 10px 20px; font-size: 12px; color: var(--sub); }
    .toolbar .spacer { flex: 1; }

    .table-wrap { padding: 0 20px 20px; overflow-x: auto; }
    table { width: 100%; border-collapse: collapse; min-width: 1380px; font-size: 12px; }
    thead th { background: #f6f8fb; color: var(--sub); font-weight: 600; text-align: left; padding: 10px; border-bottom: 1px solid var(--line); white-space: nowrap; }
    tbody td { padding: 11px 10px; border-bottom: 1px solid var(--line); vertical-align: top; }
    tbody tr:hover { background: #fafbfd; }
    tbody tr.row-pending { background: #fffbf5; }

    .listing-info .row { font-size: 12px; line-height: 1.75; color: var(--sub); }
    .listing-info .row b { color: var(--text); font-weight: 500; min-width: 64px; display: inline-block; }
    .listing-info .msku { color: var(--pri); font-weight: 600; }

    .tag { display: inline-block; padding: 1px 7px; border-radius: 3px; font-size: 11px; line-height: 18px; white-space: nowrap; }
    .st-待处理 { background: #fff7e6; color: var(--warn); }
    .st-已提交待确认 { background: #e6f4ff; color: var(--pri); }
    .st-无需处理 { background: #f5f5f5; color: var(--sub); }
    .st-处理成功 { background: #f0f9f3; color: var(--ok); }
    .st-处理失败 { background: #fff1f0; color: var(--danger); }
    .st-业务自处理 { background: #f9f0ff; color: #722ed1; }
    .st-已替换 { background: #e6fffb; color: #13c2c2; }
    .type-tm { background: #fff1f0; color: var(--danger); border: 1px solid #ffccc7; }
    .type-ban { background: #fff7e6; color: var(--warn); border: 1px solid #ffd591; }
    .shop-del { color: var(--danger); font-weight: 600; }
    .shop-off { color: var(--sub); }
    .yes { color: var(--danger); font-weight: 600; }
    .no { color: var(--ok); }
    .word { font-weight: 600; color: var(--danger); }
    .empty { color: var(--muted); }
    .fail-info { max-width: 220px; font-size: 11px; line-height: 1.55; color: var(--sub); word-break: break-all; }
    .fail-info.has-err { color: var(--danger); }

    .pager { display: flex; align-items: center; justify-content: flex-end; gap: 8px; padding: 12px 20px 16px; font-size: 12px; color: var(--sub); }
    .toast { position: fixed; top: 24px; left: 50%; transform: translateX(-50%); background: #1f2733; color: #fff; padding: 10px 18px; border-radius: 8px; z-index: 200; opacity: 0; transition: .25s; pointer-events: none; }
    .toast.show { opacity: 1; top: 34px; }
  </style>
</head>
<body>

<header class="header">
  <div class="brand">风控系统 <span style="color:var(--muted);font-size:10px">▾</span></div>
  <div class="page-tabs"><div class="ptab on">商标词&禁用词检索看板</div></div>
  <div class="hdr-tools">
    <span>?</span><span>↓</span><span>🔔</span>
    <div class="user"><div class="avatar">袁</div><span>袁效国（IRMS-产品）</span></div>
  </div>
</header>

<div class="body">
  <nav class="sidenav">
    <div class="nav-item">📋 新品风险审核</div>
    <div class="nav-item">📦 样品管理</div>
    <div class="nav-item">⚖ 专利管理</div>
    <div class="nav-item">© 版权管理</div>
    <div class="nav-item">✎ 纠错队列管理</div>
    <div class="nav-item active">📊 商标词&禁用词检索看板</div>
  </nav>

  <main class="content">
    <div class="page">
      <div class="page-hd">
        <div>
          <h1 class="page-title">商标词&禁用词检索看板</h1>
          <p class="page-sub">美国站检索记录</p>
        </div>
        <div class="site-badge">🇺🇸 Amazon US</div>
      </div>

      <div class="status-row" id="statusRow"></div>

      <div class="filters">
        <div class="filter-row">
          <div class="field"><span class="lbl">MSKU</span><input class="ctrl" id="fMsku" placeholder="渠道SKU" /></div>
          <div class="field"><span class="lbl">SKU</span><input class="ctrl" id="fSku" placeholder="系统SKU" /></div>
          <div class="field"><span class="lbl">检索词</span><input class="ctrl" id="fWord" placeholder="如 NINJA" /></div>
          <div class="field"><span class="lbl">检索类型</span>
            <select class="ctrl" id="fType"><option value="">全部</option><option>商标词</option><option>禁用词</option></select>
          </div>
          <div class="field"><span class="lbl">店铺状态</span>
            <select class="ctrl" id="fShop"><option value="">全部</option><option>删除</option><option>不开启</option></select>
          </div>
          <div class="field"><span class="lbl">Listing删除</span>
            <select class="ctrl" id="fDel"><option value="">全部</option><option>是</option><option>否</option></select>
          </div>
          <div class="field"><span class="lbl">检索时间</span><input class="ctrl" type="date" id="fDateFrom" value="2026-05-17" /></div>
          <button class="btn pri" id="btnSearch">查询</button>
          <button class="btn" id="btnReset">重置</button>
        </div>
      </div>

      <div class="toolbar">
        <span>当前展示 <b id="resultCount">0</b> 条检索记录</span>
        <span class="spacer"></span>
        <button class="btn" id="btnExport">导出</button>
      </div>

      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th style="width:260px">Listing 信息</th>
              <th>检索时间</th>
              <th>处理时间</th>
              <th>处理状态</th>
              <th>检索词</th>
              <th>检索类型</th>
              <th>Listing 是否删除</th>
              <th style="min-width:200px">删除错误信息</th>
            </tr>
          </thead>
          <tbody id="tableBody"></tbody>
        </table>
      </div>

      <div class="pager">
        <span>每页 20 条</span>
        <button disabled>‹</button><button class="on" style="background:var(--pri);color:#fff;border-color:var(--pri)">1</button><button disabled>›</button>
      </div>
    </div>
  </main>
</div>

<div class="toast" id="toast"></div>

<script src="sample-data.js"></script>
<script>
const DATA = window.TRADEMARK_SEARCH_DATA;
const ALL_STATUS = ["待处理", "已提交待确认", "无需处理", "处理成功", "处理失败", "业务自处理", "已替换"];
const STATUS_COUNTS = DATA.meta.statusCountsFull;

let records = [...DATA.records];
let filtered = [...records];
let statusFilter = "";

function toast(msg) {
  const t = document.getElementById("toast");
  t.textContent = msg;
  t.classList.add("show");
  setTimeout(() => t.classList.remove("show"), 1800);
}

function esc(s) {
  return String(s ?? "").replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
}

function renderStatusChips() {
  document.getElementById("statusRow").innerHTML = `
    <div class="status-chip ${statusFilter === "" ? "on" : ""}" data-status="">全部 <span class="cnt">(${Object.values(STATUS_COUNTS).reduce((a,b)=>a+b,0).toLocaleString()})</span></div>
    ${ALL_STATUS.map(st => `
      <div class="status-chip ${statusFilter === st ? "on" : ""}" data-status="${st}">
        ${st} <span class="cnt">(${(STATUS_COUNTS[st] || 0).toLocaleString()})</span>
      </div>
    `).join("")}
  `;
}

function renderTable() {
  const tbody = document.getElementById("tableBody");
  tbody.innerHTML = filtered.map(r => `
    <tr class="${r.dealStatus === "待处理" ? "row-pending" : ""}">
      <td>
        <div class="listing-info">
          <div class="row"><b>MSKU</b><span class="msku">${esc(r.msku)}</span></div>
          <div class="row"><b>店铺名称</b>${esc(r.shopName)}</div>
          <div class="row"><b>SKU</b>${esc(r.sku)}</div>
          <div class="row"><b>店铺状态</b><span class="${r.shopStatus === "删除" ? "shop-del" : "shop-off"}">${esc(r.shopStatus)}</span></div>
          <div class="row"><b>业务员</b>${esc(r.salesman)}</div>
        </div>
      </td>
      <td>${esc(r.detectTime) || '<span class="empty">—</span>'}</td>
      <td>${esc(r.dealTime) || '<span class="empty">—</span>'}</td>
      <td><span class="tag st-${esc(r.dealStatus)}">${esc(r.dealStatus)}</span></td>
      <td><span class="word">${esc(r.word)}</span></td>
      <td><span class="tag ${r.wordType === "商标词" ? "type-tm" : "type-ban"}">${esc(r.wordType)}</span></td>
      <td><span class="${r.listingDeleted === "是" ? "yes" : "no"}">${esc(r.listingDeleted)}</span></td>
      <td>${r.deleteErrorInfo ? `<span class="fail-info has-err" title="${esc(r.deleteErrorInfo)}">${esc(r.deleteErrorInfo)}</span>` : '<span class="fail-info empty">—</span>'}</td>
    </tr>
  `).join("");
  document.getElementById("resultCount").textContent = filtered.length;
}

function applyFilters() {
  const msku = document.getElementById("fMsku").value.trim().toUpperCase();
  const sku = document.getElementById("fSku").value.trim();
  const word = document.getElementById("fWord").value.trim().toUpperCase();
  const type = document.getElementById("fType").value;
  const shop = document.getElementById("fShop").value;
  const del = document.getElementById("fDel").value;

  filtered = records.filter(r => {
    if (statusFilter && r.dealStatus !== statusFilter) return false;
    if (msku && !r.msku.toUpperCase().includes(msku)) return false;
    if (sku && !String(r.sku).includes(sku)) return false;
    if (word && !r.word.toUpperCase().includes(word)) return false;
    if (type && r.wordType !== type) return false;
    if (shop && r.shopStatus !== shop) return false;
    if (del && r.listingDeleted !== del) return false;
    return true;
  });
  renderTable();
}

document.getElementById("statusRow").onclick = e => {
  const chip = e.target.closest(".status-chip");
  if (!chip) return;
  statusFilter = chip.dataset.status;
  renderStatusChips();
  applyFilters();
};
document.getElementById("btnSearch").onclick = () => { applyFilters(); toast("已筛选"); };
document.getElementById("btnReset").onclick = () => {
  ["fMsku","fSku","fWord"].forEach(id => document.getElementById(id).value = "");
  ["fType","fShop","fDel"].forEach(id => document.getElementById(id).value = "");
  statusFilter = "";
  renderStatusChips();
  filtered = [...records];
  renderTable();
};
document.getElementById("btnExport").onclick = () => toast("原型演示：导出待接入 BI");

renderStatusChips();
renderTable();
</script>
</body>
</html>
